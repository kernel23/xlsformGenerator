<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XLSForm Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QWebChannel library for Python-JS communication -->
    <script src="qwebchannel.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Other styles remain the same */
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="container mx-auto p-4 sm:p-6 lg:p-8 max-w-5xl">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900">XLSForm Layer Generator</h1>
            <p class="text-lg text-gray-600 mt-2">Design your survey below. Use the "Create Layer" button in QGIS to generate the layer.</p>
        </header>

        <!-- Form Settings -->
        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <h2 class="text-2xl font-semibold mb-4 border-b pb-2">Survey Settings</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="form_title" class="block text-sm font-medium text-gray-700">Form Title</label>
                    <input type="text" id="form_title" value="My Awesome Survey" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
                <div>
                    <label for="form_id" class="block text-sm font-medium text-gray-700">Form ID (Layer Name)</label>
                    <input type="text" id="form_id" value="my_awesome_survey" class="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm">
                </div>
            </div>
        </div>

        <!-- Form Builder Area -->
        <div id="form-builder" class="space-y-6"></div>

        <div id="no-questions-message" class="text-center py-12 bg-white rounded-xl shadow-md">
            <h3 class="mt-2 text-sm font-medium text-gray-900">No questions yet</h3>
            <p class="mt-1 text-sm text-gray-500">Get started by adding a new question.</p>
        </div>

        <!-- Action Buttons are now in the Python UI, so they are removed from here -->
    </div>

    <!-- Floating Action Button (FAB) -->
    <div id="fab-container" class="fixed bottom-8 right-8 z-20">
        <div id="fab-menu" class="absolute bottom-20 right-0 w-48 bg-white rounded-lg shadow-xl p-2 space-y-1 transform scale-95 opacity-0 pointer-events-none">
            <h3 class="text-sm font-semibold text-gray-500 px-2 mb-1">Question Type</h3>
        </div>
        <button id="fab-btn" class="w-16 h-16 bg-indigo-600 text-white rounded-full shadow-lg flex items-center justify-center hover:bg-indigo-700">
            <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
            </svg>
        </button>
    </div>

    <script>
        // --- STATE MANAGEMENT & CORE LOGIC (remains mostly the same) ---
        let surveyQuestions = [];
        let choices = [];
        let questionCounter = 0;
        const questionTypes = [
            { type: 'text', label: 'Text' }, { type: 'integer', label: 'Integer' },
            { type: 'decimal', label: 'Decimal' }, { type: 'date', label: 'Date' },
            { type: 'select_one', label: 'Select One' }, { type: 'select_multiple', label: 'Select Multiple' },
            { type: 'geopoint', label: 'Geopoint' }, { type: 'note', label: 'Note' },
            { type: 'begin group', label: 'Begin Group' }, { type: 'end group', label: 'End Group' }
        ];

        // --- All the functions like addQuestion, render, createQuestionHTML etc. remain here ---
        // (Keeping the script brief for this example, but the full logic from before is assumed to be here)
        const formBuilder = document.getElementById('form-builder');
        const noQuestionsMessage = document.getElementById('no-questions-message');
        const fabBtn = document.getElementById('fab-btn');
        const fabMenu = document.getElementById('fab-menu');

        function render() {
            // ... render logic from before
        }
        function addQuestion(type) {
            // ... addQuestion logic from before
        }
        // ... etc. all other helper functions from before are here

        // --- PYTHON-JAVASCRIPT BRIDGE ---
        let pyBackend;

        window.onload = function() {
            // Initialize the QWebChannel
            new QWebChannel(qt.webChannelTransport, function (channel) {
                // Make the 'backend' object from Python available globally
                pyBackend = channel.objects.backend;
                console.log("Python backend connected.");
            });
        };

        function sendDataToPython() {
            if (!pyBackend) {
                alert("Python backend is not connected yet.");
                return;
            }

            // Collect all data into a single JSON object
            const formData = {
                settings: {
                    form_title: document.getElementById('form_title').value,
                    form_id: document.getElementById('form_id').value
                },
                questions: surveyQuestions,
                choices: choices
            };

            // Send the data to the Python backend
            pyBackend.generate_layer(formData);
        }

        // --- INITIALIZATION ---
        // populateFabMenu(); // This function also needs to be here
        // render();
    </script>
</body>
</html>
